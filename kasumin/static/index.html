<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kasumin カメラ</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='8' width='20' height='16' rx='4' fill='%234f8cff'/%3E%3Cpath d='M22 13l8-4v14l-8-4z' fill='%234f8cff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="static/kasumin.css">
<script src="static/viewer.js" defer></script>
</head>
<body>
<header>
  <span class="dot" id="dot"></span>
  <h1>Kasumin</h1>
  <span class="stats" id="stats">接続しています…</span>
  <nav id="authNav" hidden>
    <a class="button" href="settings">設定</a>
    <button id="btnLogout" type="button">ログアウト</button>
  </nav>
</header>
<main>
  <div class="viewer" id="viewer">
    <img id="stream" alt="ライブ映像">
    <div class="overlay" id="overlay">
      <strong id="overlayTitle"></strong>
      <span id="overlayText"></span>
    </div>
  </div>
  <div class="controls">
    <button id="btnPause" type="button">⏸ 一時停止</button>
    <button id="btnReconnect" type="button">↻ 再接続</button>
    <button id="btnSnap" type="button">📷 スナップショット保存</button>
    <button id="btnFull" type="button">⛶ 全画面</button>
    <label>FPS 上限
      <select id="fpsSel">
        <option value="">なし</option>
        <option value="15">15</option>
        <option value="10">10</option>
        <option value="5">5</option>
        <option value="2">2</option>
        <option value="1">1</option>
      </select>
    </label>
  </div>
  <div class="urls">
    <div class="row"><span class="label">MJPEG ストリーム</span><code id="urlStream"></code><button type="button" data-copy="urlStream">コピー</button></div>
    <div class="row"><span class="label">スナップショット</span><code id="urlSnap"></code><button type="button" data-copy="urlSnap">コピー</button></div>
    <div class="row"><span class="label">ステータス (JSON)</span><code id="urlStatus"></code><button type="button" data-copy="urlStatus">コピー</button></div>
  </div>
  <p class="hint">
    ストリーム URL は VLC、OBS (メディアソース)、Home Assistant (MJPEG IP Camera) などからも直接開けます。
    URL に <code>?fps=5</code> を付けると、そのクライアントへの配信レートを制限できます。
  </p>
  <p class="hint" id="tokenHint" hidden>
    FIDO2 認証が有効なため、アプリから開くにはアクセストークンが必要です。
    <a href="settings">設定</a>で発行したトークンを、URL の末尾に <code>?token=…</code> の形で付けてください。
  </p>
</main>
</body>
</html>
